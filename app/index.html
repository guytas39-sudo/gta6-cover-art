<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panels — GTA-Style Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">VP</span>
      <span class="brand-name">VICE PANELS</span>
      <span class="brand-sub">cover art studio</span>
    </div>
    <p class="top-note">Your photos never leave this machine.</p>
  </header>

  <main class="workspace">
    <section class="stage-area">
      <div class="canvas-frame">
        <canvas id="stage" width="1080" height="1080" aria-label="Cover preview"></canvas>
      </div>
      <p class="hint">Click a panel to select it. Drag on the cover to move its photo; scroll to zoom.</p>
      <p id="status" role="status"></p>
    </section>

    <aside class="controls">
      <section class="group">
        <h2>Post size</h2>
        <div class="row toggles">
          <button type="button" data-size="1080x1080" class="active">Square 1080 × 1080</button>
          <button type="button" data-size="1080x1350">Portrait 1080 × 1350</button>
          <button type="button" data-size="1920x1080">Wide 1920 × 1080</button>
        </div>
      </section>

      <section class="group">
        <h2>Photos</h2>
        <div id="dropZone" class="drop-zone">Drop photos here, or click to choose files</div>
        <div id="photoStrip" class="photo-strip"></div>
        <div class="row">
          <button type="button" id="addPhotos">Add photos…</button>
          <button type="button" id="addSamples">Add samples</button>
        </div>
      </section>

      <section class="group">
        <h2 id="panelLabel">Panel</h2>
        <div class="row">
          <button type="button" id="prevPhoto">← Photo</button>
          <button type="button" id="nextPhoto">Photo →</button>
          <button type="button" id="resetView">Reset view</button>
        </div>
        <label class="slider">Zoom <input id="zoom" type="range" min="100" max="350" value="100"></label>
        <button type="button" id="fillOne" class="wide">Use this photo in every panel</button>
      </section>

      <section class="group">
        <h2>Layout</h2>
        <div class="row toggles">
          <button type="button" data-template="grid" class="active">Poster Grid</button>
          <button type="button" data-template="strips">Strips</button>
          <button type="button" data-template="slash">Slash</button>
        </div>
        <label class="slider">Panel gap <input id="gap" type="range" min="0" max="28" value="10"></label>
      </section>

      <section class="group">
        <h2>Colour grade</h2>
        <div class="row toggles swatches">
          <button type="button" data-theme="sunset" class="active sw-sunset">Vice Sunset</button>
          <button type="button" data-theme="neon" class="sw-neon">Neon Night</button>
          <button type="button" data-theme="gold" class="sw-gold">Gold Hour</button>
          <button type="button" data-theme="midnight" class="sw-midnight">Midnight Mono</button>
        </div>
      </section>

      <section class="group">
        <h2>Caption</h2>
        <label>Title <input id="title" type="text" maxlength="42" value="Vice Heat"></label>
        <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="Welcome back to Leonida"></label>
        <div class="row">
          <span class="row-label">Lettering</span>
          <button type="button" data-color="#ffffff" class="active chip chip-white" aria-label="White lettering"></button>
          <button type="button" data-color="#ff2e88" class="chip chip-pink" aria-label="Pink lettering"></button>
          <button type="button" data-color="#ffc233" class="chip chip-gold" aria-label="Gold lettering"></button>
          <button type="button" data-color="#00e5ff" class="chip chip-cyan" aria-label="Cyan lettering"></button>
        </div>
        <label>Position
          <select id="captionPos">
            <option value="bottom" selected>Bottom</option>
            <option value="top">Top</option>
          </select>
        </label>
      </section>

      <section class="group">
        <button type="button" id="export" class="export-btn">Export PNG</button>
      </section>
    </aside>
  </main>
</div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<script type="module" src="./src/main.js"></script>
</body>
</html>
